name: Daily data pipeline

# Data Agent -> Forecast Agent -> Alert Agent drafts. Commits data/processed/*.json;
# the Vercel Git integration then redeploys the site with the new numbers.
on:
  schedule:
    - cron: "0 4 * * *"    # 09:30 IST
    - cron: "30 12 * * *"  # 18:00 IST, picks up late AGMARKNET uploads
  workflow_dispatch:
    inputs:
      history:
        description: "Pull full history from data.gov.in (needs DATA_GOV_IN_API_KEY)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Run pipeline
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.history }}" = "true" ]; then python -m pipeline.run --history; else python -m pipeline.run; fi

      - name: Check the new data still passes the tests
        run: python -m pytest tests -q

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/raw/weather.csv data/raw/agmarknet
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase
          git push

      - name: Record a failed run
        if: failure()
        run: |
          git checkout -- . || true
          python - <<'PY'
          import json, datetime, pathlib
          p = pathlib.Path("data/processed/run_history.json")
          h = json.loads(p.read_text()) if p.exists() else []
          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)).date().isoformat()
          if not any(x["date"] == today and x["status"] == "ok" for x in h):
              h.append({"date": today, "status": "failed", "source": None, "data_as_of": None})
          p.write_text(json.dumps(h[-180:], separators=(",", ":")))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/run_history.json
          git diff --cached --quiet || (git commit -m "data: record failed pipeline run" && git pull --rebase && git push)
